<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/image/IMG-20240829-WA0343-removebg-preview (1).png"
    />
    <title>SINCERE TV</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="d-grid mt-5">
      <div class="d-flex justify-content-center">
        <img
          src="/image/IMG-20240829-WA0343-removebg-preview (1).png"
          height="100"
          width="100"
          alt=""
        />
      </div>
      <div class="d-grid justify-content-around">
        <form id="loginForm">
          <div class="d-flex justify-content-center">
            <h5>Welcome to Sincere TV Online Market</h5>
          </div>
          <div class="d-flex justify-content-center">
            <p>Type your e-mail or phone number to log in.</p>
          </div>
        <div class="d-grid gap-3">
          <div class="mb-3">
            <label for="email" class="form-label"
              >Email address or Phone number</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              aria-describedby="emailHelp"
              placeholder="Email address*"
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              aria-describedby="password"
              placeholder="Password*"
            />
          </div>
          <div class="d-flex justify-content-between">
            <div>
              Don't have an account?
              <a
                class="icon-link icon-link-hover"
                style="--bs-link-hover-color-rgb: 25, 135, 84"
                href="/Sincere TV/signUpPage.html"
              >
                Sign Up
              </a>
            </div>
              <a
                class="icon-link icon-link-hover"
                style="--bs-link-hover-color-rgb: 25, 135, 84"
                href="/forgottenPassword.html"
              >
                Forgotten password
              </a>
          </div>
          <div class="d-flex justify-content-center">
            <button
              type="submit"
              href="/HTML/successPage.html"
              class="btn btn-warning continue-btn"
            >
              Continue
            </button>
            <!-- <button type="submit"class="btn btn-warning">Continue</button> -->
          </div>
          <div class="d-grid justify-content-center mt-3">
            <div id="emailHelp" class="form-text">
              By continuing you agree to Sincere's
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <a
              class="icon-link icon-link-hover"
              style="--bs-link-hover-color-rgb: 25, 135, 84"
              href="#"
            >
              Terms and Conditions
            </a>
          </div>
          <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-facebook"
                viewBox="0 0 16 16"
              >
                <path
                  d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"
                />
              </svg>
              &nbsp;Login With Facebook
            </button>
          </div>
          <div class="d-grid justify-content-center">
            <p>
              For further support, you may visit the Help Center or contact our
              customer service team.
            </p>
        </div>
      </div>
        </form>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="text/javascript" src="/JAVASCRIPT/formPage.js"></script>
  </body>
</html>
